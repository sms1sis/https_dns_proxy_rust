name: Android CI

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle             # was missing — saves ~1 min re-downloading deps

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-linux-android

    - name: Install cargo-binstall
      uses: cargo-bins/cargo-binstall@main

    - name: Install cargo-ndk
      run: cargo binstall --no-confirm cargo-ndk

    # Cache Rust registry and build artefacts — avoids full recompile every run
    - name: Cache Rust
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target/
        key: rust-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
        restore-keys: rust-${{ runner.os }}-

    - name: Set up Android NDK
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r29          # matches local NDK 29.0.14206865
        add-to-path: true

    - name: Build Rust Core
      # RUSTFLAGS is intentionally NOT set here — build_android.sh owns it
      run: |
        export ANDROID_NDK_HOME=$ANDROID_NDK_ROOT
        chmod +x build_android.sh
        ./build_android.sh -d    # debug build for CI

    - name: Build Android App
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: SafeDNS-Debug-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
